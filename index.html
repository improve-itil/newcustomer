<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טופס פתיחת לקוח חדש</title>
    <link rel="icon" type="image/png" href="./new.png?v=2">
    <link rel="apple-touch-icon" href="./new.png?v=2">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); box-sizing: border-box; }
        .logo { display: block; margin: 0 auto 20px auto; max-width: 200px; }
        h1 { text-align: center; color: #2C3E50; margin-bottom: 30px; }
        label { font-weight: 600; display: block; margin-bottom: 5px; }
        .required-asterisk { color: red; margin-right: 3px; display: inline-block; }
        input[type="text"], input[type="email"], input[type="tel"] { width: calc(100% - 24px); padding: 14px 12px; margin: 8px 0 20px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; transition: border-color 0.3s ease; box-sizing: border-box; }
        input:focus { border-color: #2C3E50; outline: none; box-shadow: 0 0 0 3px #2c3e5014; }
        input[aria-invalid="true"] { border-color: #dc4848; background: #fffafa; margin-bottom: 6px; }
        input[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px #dc484814; }
        .field-error { display: flex; align-items: flex-start; gap: 7px; color: #a82f36; font-size: 13px; line-height: 1.6; margin: 0 0 18px; }
        .field-error::before { content: '!'; flex: 0 0 17px; height: 17px; margin-top: 2px; border-radius: 50%; background: #fce4e5; font-weight: 700; text-align: center; line-height: 17px; }
        button { background-color: #2C3E50; color: white; padding: 15px; border: none; border-radius: 8px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; transition: background-color 0.3s ease; }
        button:hover { background-color: #34495E; }
        button:disabled { background-color: #7f8c8d; cursor: not-allowed; }
        .note { font-size: 14px; color: #666; margin-top: 20px; text-align: center; }
        #statusMessage { margin-top: 20px; padding: 18px; border: 1px solid #dce5ed; border-radius: 12px; background: #f4f8fb; color: #344b60; display: none; align-items: flex-start; gap: 12px; text-align: right; overflow-wrap: anywhere; }
        #statusMessage.success { background: #f0faf5; border-color: #c5e8d5; color: #246044; }
        #statusMessage.warning { background: #fffbef; border-color: #f1dfab; color: #785d18; }
        #statusMessage.error { background: #fff5f5; border-color: #f1cccc; color: #96363d; }
        .status-icon { display: grid; place-items: center; flex: 0 0 30px; height: 30px; border-radius: 50%; background: #e3edf5; font-size: 18px; font-weight: 700; }
        .success .status-icon { background: #d9f0e3; }
        .warning .status-icon { background: #faedc7; }
        .error .status-icon { background: #f9dfe1; }
        .status-title { display: block; margin-bottom: 4px; font-size: 15px; font-weight: 700; }
        .status-description { margin: 0; font-size: 14px; line-height: 1.65; }
        .status-icon.is-loading { box-sizing: border-box; flex-basis: 24px; height: 24px; margin: 3px; background: transparent; border: 2px solid #d7e3ec; border-top-color: #344b60; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .status-icon.is-loading { animation: none; } }
        @media (max-width: 480px) { body { padding: 12px; } .container { padding: 24px 18px; } #statusMessage { padding: 14px; } }
    </style>
</head>
<body>
    <div class="container">
        <a rel="noopener noreferrer" target="_blank" href="https://www.improve-it.co.il/"><img src="./logo%20improve-it.png" alt="לוגו החברה" class="logo"></a>
        <h1>טופס פתיחת לקוח חדש</h1>
        
        <form id="clientForm">
            <label><span class="required-asterisk">*</span> שם החברה</label>
            <input type="text" name="company_name" required>

            <label><span class="required-asterisk">*</span> כתובת</label>
            <input type="text" name="address" required>

            <label>מיקוד</label>
            <input type="text" name="zipcode">

            <label><span class="required-asterisk">*</span> מספר ח.פ/עוסק מורשה</label>
            <input type="text" name="business_id" required>

            <label><span class="required-asterisk">*</span> שם איש קשר לניהול הפרויקט</label>
            <input type="text" name="project_contact_name" required>

            <label><span class="required-asterisk">*</span> טלפון של איש קשר לניהול הפרויקט</label>
            <input type="tel" name="project_contact_phone" required>

            <label><span class="required-asterisk">*</span> דוא"ל של איש קשר לניהול הפרויקט</label>
            <input type="email" name="project_contact_email" required>

            <label><span class="required-asterisk">*</span> שם איש קשר לניהול כספים וגבייה</label>
            <input type="text" name="finance_contact_name" required>

            <label><span class="required-asterisk">*</span> טלפון של איש קשר לניהול כספים וגבייה</label>
            <input type="tel" name="finance_contact_phone" required>

            <label><span class="required-asterisk">*</span> כתובות מייל לשליחת חשבוניות</label>
            <div id="invoiceEmailsContainer">
                <input type="email" name="invoice_emails[]" required oninput="addNewEmailField(this)">
            </div>

            <button type="submit" id="submitBtn">שלח טופס</button>
        </form>
        
        <div id="statusMessage" role="status" aria-live="polite" aria-atomic="true"></div>
        <p class="note">הטופס נבנה על ידי Improve-IT</p>
    </div>

    <script src="form.js"></script>
</body>
</html>
