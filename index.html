<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טופס פתיחת לקוח חדש</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); box-sizing: border-box; }
        .logo { display: block; margin: 0 auto 20px auto; max-width: 200px; }
        h1 { text-align: center; color: #2C3E50; margin-bottom: 30px; }
        label { font-weight: 600; display: block; margin-bottom: 5px; }
        .required-asterisk { color: red; margin-right: 3px; display: inline-block; }
        input[type="text"], input[type="email"], input[type="tel"] { width: calc(100% - 24px); padding: 14px 12px; margin: 8px 0 20px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; transition: border-color 0.3s ease; box-sizing: border-box; }
        input:focus { border-color: #2C3E50; outline: none; }
        button { background-color: #2C3E50; color: white; padding: 15px; border: none; border-radius: 8px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; transition: background-color 0.3s ease; }
        button:hover { background-color: #34495E; }
        button:disabled { background-color: #7f8c8d; cursor: not-allowed; }
        .note { font-size: 14px; color: #666; margin-top: 20px; text-align: center; }
        #statusMessage { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; display: none; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <a target="_blank" href="https://www.improve-it.co.il/"><img src="https://www.improve-it.co.il/wp-content/uploads/2021/03/logo-improve-it.png" alt="לוגו החברה" class="logo"></a>
        <h1>טופס פתיחת לקוח חדש</h1>
        
        <form id="clientForm">
            <label><span class="required-asterisk">*</span> שם החברה</label>
            <input type="text" name="company_name" required>

            <label><span class="required-asterisk">*</span> כתובת</label>
            <input type="text" name="address" required>

            <label>מיקוד</label>
            <input type="text" name="zipcode">

            <label><span class="required-asterisk">*</span> מספר ח.פ/עוסק מורשה</label>
            <input type="text" name="business_id" required>

            <label><span class="required-asterisk">*</span> שם איש קשר לניהול הפרויקט</label>
            <input type="text" name="project_contact_name" required>

            <label><span class="required-asterisk">*</span> טלפון של איש קשר לניהול הפרויקט</label>
            <input type="tel" name="project_contact_phone" required>

            <label><span class="required-asterisk">*</span> דוא"ל של איש קשר לניהול הפרויקט</label>
            <input type="email" name="project_contact_email" required>

            <label><span class="required-asterisk">*</span> שם איש קשר לניהול כספים וגבייה</label>
            <input type="text" name="finance_contact_name" required>

            <label><span class="required-asterisk">*</span> טלפון של איש קשר לניהול כספים וגבייה</label>
            <input type="tel" name="finance_contact_phone" required>

            <label><span class="required-asterisk">*</span> כתובות מייל לשליחת חשבוניות</label>
            <div id="invoiceEmailsContainer">
                <input type="email" name="invoice_emails[]" required oninput="addNewEmailField(this)">
            </div>

            <button type="submit" id="submitBtn">שלח טופס</button>
        </form>
        
        <div id="statusMessage"></div>
        <p class="note">הטופס נבנה על ידי Improve-IT</p>
    </div>

    <script>
        // פונקציה להוספת שדות אימייל דינמיים לחשבוניות
        function addNewEmailField(input) {
            if (input.value.trim() !== "" && !input.nextElementSibling) {
                const newInput = document.createElement('input');
                newInput.type = 'email';
                newInput.name = 'invoice_emails[]';
                newInput.style.marginTop = '10px';
                newInput.oninput = function() { addNewEmailField(newInput); };
                document.getElementById('invoiceEmailsContainer').appendChild(newInput);
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('clientForm');
            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');

            // ⚠️ ודא שזהו הקישור העדכני של ה-Web App שלך מגוגל (מפרויקט ה-Apps Script שבו מוגדר ה-JSON.parse בתוך ה-doPost)
            const webAppUrl = 'https://script.google.com/macros/s/AKfycbyDSZagk2gUjbqkCGBpdOmiENEiaq5O5iVLKE_poS7K4-SuVxmOclHpORKVu5bPMKyP/exec';

            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    // חסימת הכפתור ועדכון סטטוס זמני
                    submitBtn.disabled = true;
                    statusMessage.style.display = "block";
                    statusMessage.className = "";
                    statusMessage.innerHTML = "שולח נתונים ישירות לגיליון, אנא המתן...";

                    // בניית אובייקט הנתונים מהטופס
                    const formData = new FormData(this);
                    const data = {};
                    
                    formData.forEach((value, key) => {
                        if (key.endsWith('[]')) {
                            const cleanKey = key.slice(0, -2);
                            if (!data[cleanKey]) data[cleanKey] = [];
                            data[cleanKey].push(value);
                        } else {
                            data[key] = value;
                        }
                    });

                    // ביצוע השליחה ב-Fetch במצב no-cors
                    fetch(webAppUrl, {
                        method: 'POST',
                        mode: 'no-cors', // אומר לדפדפן לשלוח את המידע ללא בדיקת חוקי CORS קשיחים מול גוגל
                        headers: {
                            'Content-Type': 'text/plain'
                        },
                        body: JSON.stringify(data)
                    })
                    .then(() => {
                        /* 💡 מאחר והנתונים נכנסים לגיליון בהצלחה, ברגע שה-Fetch מסיים לשדר ברשת,
                           אנחנו משחררים את הטופס ומציגים הודעת הצלחה ירוקה באופן מיידי. */
                        submitBtn.disabled = false;
                        statusMessage.className = "success";
                        statusMessage.innerHTML = "הטופס נשלח בהצלחה והנתונים התעדכנו בגיליון!";
                        form.reset();
                        
                        // איפוס מכולת שדות המייל לשדה בודד ראשוני
                        document.getElementById('invoiceEmailsContainer').innerHTML = '<input type="email" name="invoice_emails[]" required oninput="addNewEmailField(this)">';
                    })
                    .catch(error => {
                        // בלוק זה ירוץ אך ורק במקרה של שגיאת רשת פיזית (כמו ניתוק מהאינטרנט)
                        submitBtn.disabled = false;
                        statusMessage.className = "error";
                        statusMessage.innerHTML = "שגיאת תקשורת בשליחת הטופס. ודא שיש חיבור פעיל לאינטרנט.";
                        console.error('Error:', error);
                    });
                });
            }
        });
    </script>
</body>
</html>
